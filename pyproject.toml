[project]
name = "enigma-reason"
version = "0.1.0"
description = "Agentic reasoning layer — Phase 1: Situation Memory & Signal Grounding"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.128",
    "uvicorn[standard]>=0.40",
    "pydantic>=2.12",
    "pydantic-settings>=2.12",
    "websockets>=15.0",
    "langgraph>=1.0",
    "langchain-core>=1.2",
    "langchain-google-genai>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "httpx>=0.28",
    "ruff>=0.15",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
